<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lord of the Rings Character Search</title>
    <!-- bootstrap styles -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />

    <!-- styles -->
    <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
<h1 class="title text-center pt-5 shadow-lg">Lord of the Rings Character Search</h1>
 <form class="mainForm d-flex justify-content-center flex-column align-items-center mt-4 mx-auto gap-4" id="mainForm">
    <div class="mainForm__input">
    <label for="lotrSearchInput" class="lotrSearch form-label pt-4 fs-1 text-center fw-semi-bold ">Search the One API for info about your favorite characters!</label>
    <input type="text" name="lotrSearch" id="lotrSearchInput"  class="form-control fs-5" required placeholder="Enter a Character's Name (first or last) to summon their lore…">
</div>

    <button class="mainForm__submit btn text-light fs-4 p-3 fw-medium" id="formSubmit" type="submit">Speak, Friend, and Search</button>
    </form>

<!--container for error from API. -->
<div id="errorBox" class="text-center text-danger fs-2 fw-medium mt-3"></div>
<!--container for results and content. -->
<div id="content" class="contentmt-4 d-flex flex-wrap justify-content-center gap-4 w-75 mx-auto pt-3 bg-transparent"></div>



<!-- main.js -->
<script src="./src/main.js" type="module"></script>
</body>
</html>
